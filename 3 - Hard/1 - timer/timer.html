
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Timer</title>

    <style>
        body {
            min-height: 100vh;
            margin: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 24px;
            background: #181818;
            font-family: sans-serif;
        }

        #display {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 20px;
            background: #080808;
            border-radius: 10px;
        }

        .digit {
            position: relative;
            width: 38px;
            height: 68px;
        }

        /* Shared appearance of all seven segments. */
        .segment {
            position: absolute;
            background: #321010;
            border-radius: 3px;
        }

        /* A lit segment becomes bright red with a subtle glow. */
        .segment.on {
            background: #ff3030;
            box-shadow: 0 0 8px #ff2020;
        }

        /* Horizontal segments: a, g, d. */
        .a, .g, .d {
            width: 24px;
            height: 5px;
            left: 7px;
        }

        .a { top: 0; }
        .g { top: 31px; }
        .d { bottom: 0; }

        /* Vertical segments: f, b, e, c. */
        .f, .b, .e, .c {
            width: 5px;
            height: 25px;
        }

        .f { top: 4px; left: 1px; }
        .b { top: 4px; right: 1px; }
        .e { bottom: 4px; left: 1px; }
        .c { bottom: 4px; right: 1px; }

        .colon {
            color: #ff3030;
            font-size: 42px;
            font-weight: bold;
            padding-bottom: 8px;
        }

        button {
            padding: 10px 24px;
            margin: 0 4px;
            border: 0;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }

        button:disabled {
            cursor: not-allowed;
        }
    </style>
</head>
<body>

    <!-- Five static digits display seconds:centiseconds. -->

    <div id="display" role="img" aria-label="000 seconds and 00 centiseconds">

        <!-- Hundreds of seconds. -->
        <div class="digit">
            <span class="segment a"></span>
            <span class="segment b"></span>
            <span class="segment c"></span>
            <span class="segment d"></span>
            <span class="segment e"></span>
            <span class="segment f"></span>
            <span class="segment g"></span>
        </div>

        <!-- Tens of seconds. -->
        <div class="digit">
            <span class="segment a"></span>
            <span class="segment b"></span>
            <span class="segment c"></span>
            <span class="segment d"></span>
            <span class="segment e"></span>
            <span class="segment f"></span>
            <span class="segment g"></span>
        </div>

        <!-- Units of seconds. -->
        <div class="digit">
            <span class="segment a"></span>
            <span class="segment b"></span>
            <span class="segment c"></span>
            <span class="segment d"></span>
            <span class="segment e"></span>
            <span class="segment f"></span>
            <span class="segment g"></span>
        </div>

        <span class="colon">:</span>

        <!-- Tens of centiseconds. -->
        <div class="digit">
            <span class="segment a"></span>
            <span class="segment b"></span>
            <span class="segment c"></span>
            <span class="segment d"></span>
            <span class="segment e"></span>
            <span class="segment f"></span>
            <span class="segment g"></span>
        </div>

        <!-- Units of centiseconds. -->
        <div class="digit">
            <span class="segment a"></span>
            <span class="segment b"></span>
            <span class="segment c"></span>
            <span class="segment d"></span>
            <span class="segment e"></span>
            <span class="segment f"></span>
            <span class="segment g"></span>
        </div>

    </div>

    <div>
        <button id="start">Start</button>
        <button id="stop" disabled>Stop</button>
        <button id="reset">Reset</button>
    </div>

    <script>
        // Define which segments must be lit for each digit, from 0 to 9.
        const digitSegments = [
            'abcdef',  // 0
            'bc',      // 1
            'abdeg',   // 2
            'abcdg',   // 3
            'bcfg',    // 4
            'acdfg',   // 5
            'acdefg',  // 6
            'abc',     // 7
            'abcdefg', // 8
            'abcdfg'   // 9
        ];

        const display     = document.querySelector('#display');
        const startButton = document.querySelector('#start');
        const stopButton  = document.querySelector('#stop');
        const resetButton = document.querySelector('#reset');

        // Find the five digits already defined in HTML.
        // Cache each digit's segment elements so render() can update them quickly.
        const digits = [...document.querySelectorAll('.digit')].map(digit => {
            const segments = {};

            for (const name of 'abcdefg') {
                segments[name] = digit.querySelector(`.${name}`);
            }

            return segments;
        });

        // Elapsed time is stored in milliseconds.
        let elapsed = 0;
        let startTime = 0;
        let intervalId = null;

        // Maximum: 999 seconds and 59 centiseconds.
        const MAX_TIME = 999590;

        function render() {
            // Convert milliseconds to whole centiseconds.
            const totalCentiseconds = Math.floor(elapsed / 10);
            const seconds           = Math.floor(totalCentiseconds / 100);
            const centiseconds      = totalCentiseconds % 100;

            // Convert the time to five digits, for example 01234 = 012:34.
            const value = String(seconds).padStart(3, '0')
                        + String(centiseconds).padStart(2, '0');

            // Light the required segments and turn off the rest.
            for (let i = 0; i < 5; i++) {
                const required = digitSegments[Number(value[i])];

                for (const name of 'abcdefg') {
                    digits[i][name].classList.toggle(
                        'on',
                        required.includes(name)
                    );
                }
            }

            // Provide a readable description for assistive technology.
            display.setAttribute(
                'aria-label',
                `${seconds} seconds and ${String(centiseconds).padStart(2, '0')} centiseconds`
            );
        }

        function updateTimer() {
            // Calculate time from the clock rather than counting interval calls.
            elapsed = Math.min(performance.now() - startTime, MAX_TIME);
            render();

            // Stop automatically when the maximum time is reached.
            if (elapsed >= MAX_TIME) {
                stopTimer();
            }
        }

        function startTimer() {
            // Do not start a second interval or exceed the maximum time.
            if (intervalId !== null || elapsed >= MAX_TIME) return;

            // Subtract elapsed time so the timer resumes correctly after Stop.
            startTime = performance.now() - elapsed;

            // Update immediately, then refresh approximately every 10 ms.
            updateTimer();

            // updateTimer() might stop the timer if the limit has been reached.
            if (elapsed < MAX_TIME) {
                intervalId = setInterval(updateTimer, 10);
                startButton.disabled = true;
                stopButton.disabled = false;
            }
        }

        function stopTimer() {
            if (intervalId !== null) {
                // Capture the latest elapsed time before clearing the interval.
                elapsed = Math.min(performance.now() - startTime, MAX_TIME);
                clearInterval(intervalId);
                intervalId = null;
                render();
            }

            startButton.disabled = elapsed >= MAX_TIME;
            stopButton.disabled = true;
        }

        function resetTimer() {
            // Stop the interval if it is running.
            if (intervalId !== null) {
                clearInterval(intervalId);
                intervalId = null;
            }

            elapsed = 0;
            render();

            startButton.disabled = false;
            stopButton.disabled = true;
        }

        // Connect each button to its timer operation.
        startButton.addEventListener('click', startTimer);
        stopButton.addEventListener('click', stopTimer);
        resetButton.addEventListener('click', resetTimer);

        // Initialize the display to 000:00.
        render();
    </script>

</body>
</html>
