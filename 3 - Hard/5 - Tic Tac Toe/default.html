<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <!-- Keep the layout usable on phones as well as desktop screens. -->
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tic-Tac-Toe</title>

  <style>
    /* ---------- Design tokens: change these values to restyle the game. ---------- */
    :root {
      color-scheme: light;
      --page: #f4f6fb;
      --panel: #ffffff;
      --ink: #202638;
      --muted: #687086;
      --accent: #5b5ce2;
      --accent-hover: #4849c7;
      --x-color: #4b59d8;
      --o-color: #e06a38;
      --line: #e1e5ef;
      --win: #dff6e8;
      --shadow: 0 18px 50px rgb(31 41 70 / 10%);
    }

    /* A small reset keeps sizing and spacing predictable across browsers. */
    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 24px;
      display: grid;
      place-items: center;
      background: radial-gradient(circle at top, #ffffff 0, var(--page) 60%);
      color: var(--ink);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .game {
      width: min(100%, 430px);
      padding: clamp(22px, 5vw, 34px);
      border: 1px solid rgb(225 229 239 / 80%);
      border-radius: 24px;
      background: var(--panel);
      box-shadow: var(--shadow);
    }

    .eyebrow {
      margin: 0 0 8px;
      color: var(--accent);
      font-size: .75rem;
      font-weight: 800;
      letter-spacing: .14em;
      text-align: center;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(2rem, 8vw, 2.6rem);
      letter-spacing: -.055em;
      text-align: center;
    }

    .intro {
      margin: 8px 0 24px;
      color: var(--muted);
      font-size: .95rem;
      text-align: center;
    }

    /* The status line doubles as a clear, screen-reader-friendly game update. */
    .status {
      min-height: 52px;
      margin-bottom: 16px;
      padding: 14px 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      border-radius: 14px;
      background: #f1f2ff;
      color: var(--ink);
      font-weight: 700;
      text-align: center;
    }

    .status[data-result="win"] { background: var(--win); }
    .status[data-result="draw"] { background: #fff1dc; }

    /* A 3-column grid makes the board responsive without fixed cell widths. */
    .board {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
      margin-bottom: 20px;
    }

    .cell {
      aspect-ratio: 1;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: #fafbff;
      color: var(--ink);
      cursor: pointer;
      font: inherit;
      font-size: clamp(2.6rem, 13vw, 4rem);
      font-weight: 800;
      line-height: 1;
      transition: transform 120ms ease, background 120ms ease, border-color 120ms ease;
    }

    .cell:not(:disabled):hover {
      transform: translateY(-2px);
      border-color: #b7b9f5;
      background: #f1f2ff;
    }

    .cell:focus-visible, .button:focus-visible {
      outline: 3px solid #a8a9ff;
      outline-offset: 3px;
    }

    .cell:disabled { cursor: default; }
    .cell.mark-x { color: var(--x-color); }
    .cell.mark-o { color: var(--o-color); }
    .cell.winning-cell {
      border-color: #9bd8b2;
      background: var(--win);
    }

    .button {
      width: 100%;
      min-height: 48px;
      padding: 12px 18px;
      border: 0;
      border-radius: 13px;
      background: var(--accent);
      color: white;
      cursor: pointer;
      font: inherit;
      font-weight: 750;
      transition: background 120ms ease, transform 120ms ease;
    }

    .button:hover { background: var(--accent-hover); }
    .button:active { transform: scale(.99); }

    .footnote {
      margin: 16px 0 0;
      color: var(--muted);
      font-size: .8rem;
      text-align: center;
    }

    /* Respect the operating system's reduced-motion accessibility setting. */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        scroll-behavior: auto !important;
        transition-duration: .01ms !important;
        animation-duration: .01ms !important;
      }
    }
  </style>
</head>
<body>
  <main class="game">
    <p class="eyebrow">Two-player game</p>
    <h1>Tic-Tac-Toe</h1>
    <p class="intro">Take turns. Get three in a row to win.</p>

    <!-- aria-live announces turn changes and results to assistive technology. -->
    <p class="status" id="status" role="status" aria-live="polite">X's turn</p>

    <!-- Each cell is a real button, so it supports keyboard and touch input. -->
    <section class="board" id="board" aria-label="Tic-tac-toe board">
      <button class="cell" type="button" data-index="0" aria-label="Row 1, column 1"></button>
      <button class="cell" type="button" data-index="1" aria-label="Row 1, column 2"></button>
      <button class="cell" type="button" data-index="2" aria-label="Row 1, column 3"></button>
      <button class="cell" type="button" data-index="3" aria-label="Row 2, column 1"></button>
      <button class="cell" type="button" data-index="4" aria-label="Row 2, column 2"></button>
      <button class="cell" type="button" data-index="5" aria-label="Row 2, column 3"></button>
      <button class="cell" type="button" data-index="6" aria-label="Row 3, column 1"></button>
      <button class="cell" type="button" data-index="7" aria-label="Row 3, column 2"></button>
      <button class="cell" type="button" data-index="8" aria-label="Row 3, column 3"></button>
    </section>

    <button class="button" id="restart" type="button">New game</button>
    <p class="footnote">Local play · No account or installation needed</p>
  </main>

  <script>
    /*
     * Tic-Tac-Toe logic is kept separate from the HTML structure:
     * - state stores the current game.
     * - render() updates the visible board and status.
     * - playTurn() validates and applies a move.
     * - getWinner() contains the winning-rule checks.
     * This is intentionally small enough to understand and extend.
     */
    (() => {
      // Cache the DOM elements once rather than searching for them on every move.
      const boardElement = document.querySelector("#board");
      const cells = [...boardElement.querySelectorAll(".cell")];
      const statusElement = document.querySelector("#status");
      const restartButton = document.querySelector("#restart");

      // A cell is either "X", "O", or null when it is empty.
      const state = {
        board: Array(9).fill(null),
        currentPlayer: "X",
        winner: null,
        winningLine: [],
        isDraw: false
      };

      // Each triple represents one possible winning row, column, or diagonal.
      const WINNING_LINES = [
        [0, 1, 2], [3, 4, 5], [6, 7, 8], // rows
        [0, 3, 6], [1, 4, 7], [2, 5, 8], // columns
        [0, 4, 8], [2, 4, 6]             // diagonals
      ];

      /**
       * Return the first winning line, or null if nobody has won yet.
       * Returning the line as well as the symbol lets the UI highlight the
       * three winning cells without mixing presentation into game rules.
       */
      function getWinner(board) {
        for (const line of WINNING_LINES) {
          const [a, b, c] = line;
          if (board[a] && board[a] === board[b] && board[a] === board[c]) {
            return { player: board[a], line };
          }
        }
        return null;
      }

      /**
       * Paint the current state into the page.
       * This function does not decide who wins; it only reflects state.
       */
      function render() {
        cells.forEach((cell, index) => {
          const mark = state.board[index];

          // Keep each button's text, accessible label, and disabled state in sync.
          cell.textContent = mark ?? "";
          cell.setAttribute(
            "aria-label",
            `Row ${Math.floor(index / 3) + 1}, column ${(index % 3) + 1}${mark ? `, ${mark}` : ", empty"}`
          );
          cell.disabled = Boolean(mark) || Boolean(state.winner) || state.isDraw;

          // Reset the mark styles first, then apply the class for the current mark.
          cell.classList.toggle("mark-x", mark === "X");
          cell.classList.toggle("mark-o", mark === "O");
          cell.classList.toggle("winning-cell", state.winningLine.includes(index));
        });

        // Use a data attribute so result states can be styled in CSS.
        if (state.winner) {
          statusElement.textContent = `${state.winner} wins!`;
          statusElement.dataset.result = "win";
        } else if (state.isDraw) {
          statusElement.textContent = "It's a draw!";
          statusElement.dataset.result = "draw";
        } else {
          statusElement.textContent = `${state.currentPlayer}'s turn`;
          delete statusElement.dataset.result;
        }
      }

      /**
       * Apply one move only if the game is still active and the cell is empty.
       * A click on an already-filled cell or after the game ends is ignored.
       */
      function playTurn(index) {
        if (state.board[index] !== null || state.winner || state.isDraw) return;

        state.board[index] = state.currentPlayer;

        const result = getWinner(state.board);
        if (result) {
          state.winner = result.player;
          state.winningLine = result.line;
        } else if (state.board.every(cell => cell !== null)) {
          // A draw occurs only when every cell is filled and no player has won.
          state.isDraw = true;
        } else {
          // Switch turns only if the game is still active.
          state.currentPlayer = state.currentPlayer === "X" ? "O" : "X";
        }

        render();
      }

      /** Restore the initial state so a new round can begin. */
      function resetGame() {
        state.board = Array(9).fill(null);
        state.currentPlayer = "X";
        state.winner = null;
        state.winningLine = [];
        state.isDraw = false;
        render();
      }

      // Event delegation: one listener handles clicks from all nine cells.
      boardElement.addEventListener("click", event => {
        const cell = event.target.closest(".cell");
        if (!cell) return;
        playTurn(Number(cell.dataset.index));
      });

      restartButton.addEventListener("click", resetGame);

      // Render once on startup so the UI always reflects the initial state.
      render();
    })();
  </script>
</body>
</html>
