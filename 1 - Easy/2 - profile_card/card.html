<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f5f5f5;
        }
        .card {
            padding: 2rem;
            border-radius: 15px;
            background-color: #fff;
            box-shadow: 0 0 10px #ddd;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-width: 20rem;
        }
        .card .picture {
            width: 100px;
            height: 100px;
            background-color: #ddd;
            border-radius: 50%;
        }
        .card .name {
            font-size: 1.5rem;
        }
        .card ul {
            display: flex;
            list-style-type: none;
            padding: 0;
            margin: 0;
            justify-content: center;
            width: 100%;
        }
        .card ul li {
            padding: 0 0.3rem;
        }
        .card ul li a {
            text-decoration: none;
            background-color: rgb(254, 231, 235);
            padding: 0.3rem 0.5rem;
            display: inline-block;
            border-radius: 10px;
            color: #555;
        }
        .card ul li a:hover {
            background-color: rgb(248, 212, 218);
        }
    </style>
</head>
<body>
    <div class="container">
        <section class="card">
            <div class="picture"></div>
            <h1 class="name">
                Ahmad Hejazee
            </h1>
            <p class="slogan">
                A web developer
            </p>
            <ul class="links">
                <li>
                    <a href="#">instagram</a>
                </li>
                <li>
                    <a href="#">instagram</a>
                </li>
                <li>
                    <a href="#">instagram</a>
                </li>
            </ul>
        </section>
    </div>
</body>
</html>
