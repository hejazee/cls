
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Rotating Square</title>

    <style>
        /* Center the square horizontally and vertically. */
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #ffffff;
        }

        /* Create a red square with slightly rounded corners. */
        .square {
            width: 100px;
            height: 100px;
            background-color: red;
            border-radius: 8px;

            /* Rotate continuously without stopping. */
            animation: rotate 2s linear infinite;
        }

        @keyframes rotate {
            from {
                transform: rotate(0deg);
            }

            to {
                transform: rotate(360deg);
            }
        }
    </style>
</head>
<body>

    <div class="square"></div>

</body>
</html>
