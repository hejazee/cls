<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Green Light</title>
    <style>
      * {
        box-sizing: border-box;
      }

      .signal {
        display: flex;
        flex-flow: column nowrap;
        justify-content: center;
        align-items: center;
      }

      .container {
        background-color: #222;
        height: 200px;
        width: 90px;
        border-radius: 75px;
        display: flex;
        flex-flow: column nowrap;
        justify-content: space-between;
        align-items: center;
        padding: 25px 0;
      }

      .light {
        border-radius: 100%;
        width: 40px;
        height: 40px;
        animation-iteration-count: infinite;
        animation-duration: 8s;
      }

      .red {
        background-color: #f00;
        opacity: 0.2;
      }

      .orange {
        background-color: rgb(240, 174, 33);
        opacity: 0.2;
      }

      .green {
        background-color: rgb(80, 214, 26);
        opacity: 1;
      }

      .pillar {
        width: 15px;
        height: 300px;
        background-color: #222;
        position: relative;
        top: -3px;
      }





.light {
    border-radius: 100%;
    width: 40px;
    height: 40px;
    animation-duration: 8s;
    animation-iteration-count: infinite;
    animation-timing-function: linear;
}

.red {
    background-color: #f00;
    opacity: 0.2;
    animation-name: red-light;
}

.orange {
    background-color: rgb(240, 174, 33);
    opacity: 0.2;
    animation-name: orange-light;
}

.green {
    background-color: rgb(80, 214, 26);
    opacity: 1;
    animation-name: green-light;
}

/* Green: on for the first 4 seconds. */
@keyframes green-light {
    0% {
        opacity: 1;
    }

    49.999% {
        opacity: 1;
    }

    50% {
        opacity: 0.2;
    }

    100% {
        opacity: 0.2;
    }
}

/* Orange: on from 4 to 5 seconds. */
@keyframes orange-light {
    0% {
        opacity: 0.2;
    }

    49.999% {
        opacity: 0.2;
    }

    50% {
        opacity: 1;
    }

    62.499% {
        opacity: 1;
    }

    62.5% {
        opacity: 0.2;
    }

    100% {
        opacity: 0.2;
    }
}

/* Red: on from 5 to 8 seconds. */
@keyframes red-light {
    0% {
        opacity: 0.2;
    }

    62.499% {
        opacity: 0.2;
    }

    62.5% {
        opacity: 1;
    }

    99.999% {
        opacity: 1;
    }

    100% {
        opacity: 0.2;
    }
}

    </style>
  </head>
  <body>
    <div class="signal">
      <div class="container">
        <div class="light red"></div>
        <div class="light orange"></div>
        <div class="light green"></div>
      </div>

      <div class="pillar"></div>
    </div>
  </body>
</html>
