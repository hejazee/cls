
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seamless CSS Marquee</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
        }

        /* Full-width viewport for the scrolling text. */
        .marquee {
            width: 100%;
            overflow: hidden;
            background-color: #222;
            color: #fff;
            padding: 30px 0;
        }

        /* The track holds two identical copies side by side. */
        .marquee-track {
            display: flex;
            width: max-content;
            animation: scroll 15s linear infinite;
        }

        /* Each copy occupies the width required by its text. */
        .marquee-text {
            flex-shrink: 0;
            white-space: nowrap;
            padding-right: 60px;
            font-size: clamp(40px, 8vw, 100px);
            font-weight: bold;
        }

        /* Move by exactly one copy's width. */
        @keyframes scroll {
            from {
                transform: translateX(0);
            }

            to {
                transform: translateX(-50%);
            }
        }
    </style>
</head>

<body>
    <div class="marquee">
        <div class="marquee-track">
            <div class="marquee-text">
                Welcome to the CSS Text Marquee! One Two Three Four.
            </div>

            <div class="marquee-text" aria-hidden="true">
                Welcome to the CSS Text Marquee! One Two Three Four.
            </div>
        </div>
    </div>
</body>
</html>
